[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-core"
version = "0.1.0"
description = "Shared pipeline logic for Slussen: contracts, validation, utilities"
requires-python = ">=3.13"
dependencies = ["pyyaml>=6.0", "pyarrow>=18", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]